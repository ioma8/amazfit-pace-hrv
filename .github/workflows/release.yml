name: Release

# Build all app APKs and attach them to a draft GitHub release.
# Triggered by any tag push (v*), e.g. `git tag v1.0.0 && git push origin v1.0.0`.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # gh release create / upload assets with GITHUB_TOKEN

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "build-tools;37.0.0" "platforms;android-36"

      - name: Create debug keystore
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -validity 10000

      - name: Build all APKs
        run: make

      - name: Create draft release and upload APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" apks/builds/*.apk \
            --repo "$GITHUB_REPOSITORY" --draft --generate-notes --latest=false
